<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <title>สวัสดีเช้าโลก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17202a;
      --muted: #67727d;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --card: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Noto Sans Thai", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 186, 73, .38), transparent 25rem),
        radial-gradient(circle at 88% 82%, rgba(251, 146, 60, .25), transparent 22rem),
        linear-gradient(135deg, #fffaf0 0%, #fff 48%, #fff1e6 100%);
    }

    .shape {
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
    }

    .shape-one {
      width: 180px;
      height: 180px;
      right: -70px;
      top: -55px;
      border: 26px solid rgba(249, 115, 22, .12);
    }

    .shape-two {
      width: 100px;
      height: 100px;
      left: -35px;
      bottom: 8%;
      background: rgba(253, 186, 116, .18);
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 32px));
      padding: clamp(28px, 6vw, 52px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 32px;
      background: var(--card);
      box-shadow:
        0 24px 70px rgba(109, 64, 22, .12),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(14px);
      animation: rise .8s cubic-bezier(.22, 1, .36, 1) both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff1e6;
      color: var(--orange-dark);
      font-size: 14px;
      font-weight: 600;
    }

    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 5px rgba(249, 115, 22, .12);
    }

    h1 {
      margin: 0;
      font-family: "Kodchasan", sans-serif;
      font-size: clamp(38px, 9vw, 68px);
      line-height: 1.2;
      letter-spacing: -2px;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: var(--orange);
    }

    p {
      max-width: 480px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.8;
    }

    .sun {
      display: inline-block;
      margin: 0 4px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-4px) rotate(8deg); }
    }

    @media (max-width: 520px) {
      main { border-radius: 24px; }
      h1 { letter-spacing: -1px; }
      .shape-one { width: 130px; height: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .sun { animation: none; }
    }
  </style>
</head>
<body>
  <div class="shape shape-one" aria-hidden="true"></div>
  <div class="shape shape-two" aria-hidden="true"></div>

  <main>
    <div class="badge">ยินดีต้อนรับสู่เว็บไซต์</div>
    <h1>
      สวัสดีเช้าโลก
      <span>Hello World <b class="sun">👋</b></span>
    </h1>
    <p>ทดสอบเวบประสบการณ์สวยงาม บน Vercel อย่างง่ายแต่ดูดีในทุกอุปกรณ์</p>
  </main>
</body>
</html>
