<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1d6e">
  <title>ดูดวงตามวันเดือนปีเกิด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #231a3a;
      --muted: #6d6585;
      --gold: #f5c04a;
      --purple: #3b1d6e;
      --purple2: #5b2fa8;
      --card: rgba(255,255,255,.95);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Thai", sans-serif;
      color: var(--ink);
      line-height: 1.7;
      background:
        radial-gradient(circle at 15% 10%, rgba(245,192,74,.25), transparent 22rem),
        radial-gradient(circle at 90% 30%, rgba(139,92,246,.35), transparent 26rem),
        linear-gradient(160deg, #1d0f3d 0%, #3b1d6e 55%, #2a1456 100%);
      background-attachment: fixed;
      padding: 28px 16px 48px;
    }
    .wrap { width: min(720px, 100%); margin: 0 auto; }
    header { text-align: center; color: #fff; margin-bottom: 22px; }
    header .moon { font-size: 44px; filter: drop-shadow(0 0 14px rgba(245,192,74,.6)); }
    h1 { margin: 4px 0 4px; font-size: clamp(26px, 7vw, 38px); }
    header p { margin: 0; color: #d9cffa; font-size: 16px; }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: clamp(18px, 4vw, 28px);
      box-shadow: 0 20px 50px rgba(0,0,0,.28);
      margin-bottom: 16px;
    }
    .row { display: grid; grid-template-columns: 1fr 1.6fr 1.3fr; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); font-weight: 500; }
    select, button {
      font: inherit; width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid #d8d0ee; background: #fff; color: var(--ink);
    }
    select:focus { outline: 2px solid var(--purple2); }
    button.go {
      margin-top: 14px; border: 0; cursor: pointer; font-weight: 700; font-size: 17px;
      color: #3b1d6e; background: linear-gradient(135deg, #ffd978, #f5c04a);
      box-shadow: 0 8px 20px rgba(245,192,74,.4);
    }
    button.go:hover { filter: brightness(1.05); }
    .err { color: #b91c1c; font-size: 14px; margin: 10px 0 0; min-height: 1.4em; }

    #result { display: none; }
    .hero { text-align: center; }
    .hero .em { font-size: 54px; line-height: 1.1; }
    .hero small { color: var(--muted); }
    .hero h2 { margin: 4px 0 8px; font-size: clamp(22px, 6vw, 30px); color: var(--purple); }
    .hero p { margin: 0 auto; max-width: 540px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .chip { padding: 4px 14px; border-radius: 99px; background: #efe9ff; color: var(--purple2); font-size: 14px; font-weight: 600; }

    .traits { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .trait { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .trait h3 { margin: 0 0 4px; font-size: 17px; color: var(--purple); }
    .trait p { margin: 0; font-size: 15px; }
    .meter { height: 8px; border-radius: 99px; background: #eee9fb; margin: 8px 0 10px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: linear-gradient(90deg, #8b5cf6, #f5c04a); border-radius: 99px; }
    .t12 h3 { margin: 0 0 4px; color: var(--purple); }
    .t12 .big { font-size: 22px; font-weight: 700; color: var(--purple2); margin: 0 0 8px; }
    .t12 .kv { margin: 0 0 6px; font-size: 15px; }
    .t12 .kv b { color: var(--purple); }
    .t12 details { margin-top: 12px; }
    .t12 summary { cursor: pointer; color: var(--purple2); font-weight: 600; }
    .t12 table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    .t12 th, .t12 td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee9fb; vertical-align: top; }
    .t12 tr.me { background: #fff4d6; font-weight: 600; }
    .extra h3 { margin: 0 0 6px; color: var(--purple); }
    .extra p { margin: 0 0 10px; font-size: 15px; }
    .note { color: #cfc4f0; font-size: 13px; text-align: center; margin-top: 18px; }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr 1fr; }
      .row label:last-child { grid-column: 1 / -1; }
      .traits { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="moon">🔮</div>
      <h1>ดูดวงตามวันเดือนปีเกิด</h1>
      <p>เลือกวัน เดือน ปีเกิดของคุณ แล้วดูว่าคุณเป็นคนประเภทไหน</p>
    </header>

    <form class="card" id="form" novalidate>
      <div class="row">
        <label>วันที่<select id="d" required></select></label>
        <label>เดือน<select id="m" required></select></label>
        <label>ปีเกิด (พ.ศ.)<select id="y" required></select></label>
      </div>
      <button class="go" type="submit">✨ ดูดวงเลย</button>
      <p class="err" id="err" role="alert"></p>
    </form>

    <section id="result" aria-live="polite">
      <div class="card hero">
        <div class="em" id="rEm"></div>
        <small id="rDate"></small>
        <h2 id="rType"></h2>
        <p id="rSum"></p>
        <div class="chips" id="rChips"></div>
      </div>
      <div class="traits" id="rTraits"></div>
      <div class="card t12" id="r12" style="margin-top:16px"></div>
      <div class="card t12" id="r20" style="margin-top:16px"></div>
      <div class="card t12" id="r6" style="margin-top:16px"></div>
      <div class="card t12" id="r9" style="margin-top:16px"></div>
      <div class="card extra" id="rExtra" style="margin-top:16px"></div>
    </section>

    <p class="note">* เพื่อความบันเทิงเท่านั้น ไม่ใช่การวินิจฉัยหรือคำทำนายที่พิสูจน์ได้ทางวิทยาศาสตร์ ใช้เป็นแนวทางสนุกๆ ประกอบการพูดคุยได้ครับ<br>
      ข้อมูลที่กรอกประมวลผลในเบราว์เซอร์ ไม่ถูกส่งหรือเก็บไว้ที่ใด</p>
  </div>

  <script>
    const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

    // ลักษณะตามวันเกิด (ตามตำราโหราศาสตร์ไทยแบบทั่วไป — เพื่อความบันเทิง)
    // score: [อารมณ์, ความซื่อสัตย์]  เป็นค่าประกอบภาพ (0-100) ไม่ใช่การวัดจริง
    const DAY = [
      { em:"☀️", type:"นักคิดรักความสงบ ใจเย็น มีเมตตา", color:"แดง",
        sum:"คุณเป็นคนมีอุดมคติ รักความยุติธรรม มักเป็นที่พึ่งของคนรอบข้าง แต่บางทีเก็บทุกอย่างไว้คนเดียว",
        mood:["ใจเย็น มั่นคง แต่ถ้าถูกกดดันนานๆ จะเงียบและถอยห่าง ก่อนระเบิดอารมณ์ครั้งใหญ่", 70],
        nature:"รักอิสระ ชอบเป็นผู้นำโดยไม่รู้ตัว คิดรอบคอบก่อนตัดสินใจ มีความเมตตาสูงแต่ไม่ชอบถูกบังคับ",
        honest:["ยึดมั่นในหลักการ พูดจริงทำจริง ไม่ชอบโกหกแม้เป็นเรื่องเล็ก", 85],
        persona:"ดูสง่า น่าเคารพ พูดน้อยแต่มีน้ำหนัก ให้ความรู้สึกไว้ใจได้" },
      { em:"🌙", type:"คนอ่อนโยน ละเอียดอ่อน เห็นอกเห็นใจ", color:"เหลือง",
        sum:"คุณเป็นคนอบอุ่น ใส่ใจความรู้สึกคนอื่น เข้ากับผู้คนง่าย แต่มักคิดมากและใจอ่อนเกินไปบางครั้ง",
        mood:["อารมณ์ขึ้นลงตามสถานการณ์ ไวต่อคำพูดของคนอื่น แต่หายเร็วเมื่อได้พักผ่อน", 60],
        nature:"ขี้เกรงใจ เป็นผู้ฟังที่ดี มีจินตนาการ ชอบความสวยงามและความเป็นระเบียบ ตัดสินใจช้าเพราะกลัวใครเสียใจ",
        honest:["จริงใจกับคนที่สนิท แต่บางครั้งเลี่ยงพูดความจริงที่อาจทำร้ายความรู้สึกผู้อื่น", 72],
        persona:"หน้าตาอ่อนโยน เป็นกันเอง ยิ้มง่าย ทำให้คนรอบข้างรู้สึกสบายใจ" },
      { em:"🔥", type:"นักสู้ตรงไปตรงมา กล้าหาญ มุ่งมั่น", color:"ชมพู",
        sum:"คุณเป็นคนพลังงานเต็มเปี่ยม กล้าคิดกล้าทำ ไม่กลัวอุปสรรค แต่ต้องระวังอารมณ์ร้อนที่อาจทำให้เสียความสัมพันธ์",
        mood:["ร้อนเร็วหายเร็ว โมโหง่ายแต่ไม่ผูกใจเจ็บ ต้องการพื้นที่ระบายพลังงาน", 45],
        nature:"ใจนักเลง รักพวกพ้อง ไม่ยอมแพ้ง่าย ชอบความท้าทาย พูดตรง ไม่ชอบอ้อมค้อม",
        honest:["พูดตรงไปตรงมา ไม่เสแสร้ง ซื่อสัตย์แบบไม่มีการปรุงแต่ง บางครั้งตรงจนคนฟังเจ็บ", 88],
        persona:"ดูมั่นใจ ท่าทางกระฉับกระเฉง น้ำเสียงหนักแน่น เป็นจุดสนใจโดยไม่ตั้งใจ" },
      { em:"🌿", type:"นักสื่อสารช่างพูด ปรับตัวเก่ง ฉลาดเฉลียว", color:"เขียว",
        sum:"คุณเป็นคนหัวไว เรียนรู้เร็ว เข้ากับคนได้ทุกกลุ่ม เหมาะกับงานที่ต้องใช้ไหวพริบและการพูดคุย แต่บางครั้งใจเปลี่ยนเร็ว",
        mood:["อารมณ์แจ่มใส ร่าเริง แต่ไวต่อความเครียดจนคิดฟุ้งซ่านได้", 65],
        nature:"ช่างสังเกต ช่างพูด ชอบเรียนรู้สิ่งใหม่ มองโลกในแง่ดี รักความสะดวกสบาย และไม่ชอบอยู่นิ่ง",
        honest:["พูดเก่งจึงต้องระวังการพูดเกินจริงเพื่อเอาใจ แต่ถ้าสัญญาแล้วมักทำตามที่รับปาก", 68],
        persona:"คล่องแคล่ว มีเสน่ห์ในการพูดคุย ยิ้มแย้ม เข้าหาคนง่าย" },
      { em:"📚", type:"ผู้ใหญ่ใจดี น่าเชื่อถือ รักความเป็นธรรม", color:"ส้ม",
        sum:"คุณเป็นคนมีเหตุผล สุขุม ใฝ่รู้ เป็นที่ปรึกษาที่ดี ผู้คนมักเคารพและไว้ใจ แต่บางครั้งยึดความคิดตัวเองมากไป",
        mood:["สุขุม นิ่ง ควบคุมอารมณ์ได้ดี ไม่ค่อยแสดงออกว่าโกรธหรือเสียใจ", 85],
        nature:"รักการเรียนรู้ มีศีลธรรมในใจ ใจกว้าง ชอบช่วยเหลือคนอื่น มีความคิดเป็นระบบ",
        honest:["ซื่อสัตย์ มีหลักคุณธรรมสูง ถือคำพูดเป็นสิ่งสำคัญ คนรอบข้างมักฝากความลับได้", 92],
        persona:"สุภาพ น่านับถือ แต่งกายเรียบร้อย พูดจามีหลักการ ดูเป็นผู้ใหญ่เกินวัย" },
      { em:"💖", type:"คนมีเสน่ห์ รักความสวยงาม ใจกว้าง", color:"ฟ้า",
        sum:"คุณเป็นคนมีเสน่ห์ ชอบสังคม รักความสุขและสิ่งสวยงาม มีคนรักใคร่เอ็นดู แต่ต้องระวังการใช้จ่ายและความรักที่ท่วมท้น",
        mood:["อารมณ์ดี ชอบความสุนทรีย์ แต่ถ้าถูกปฏิเสธจะเสียใจมากกว่าที่แสดงออก", 75],
        nature:"รักความสะดวกสบาย โอบอ้อมอารี รักสนุก ชอบแต่งตัว ชอบมีเพื่อนเยอะ ใจอ่อนกับคนที่รัก",
        honest:["จริงใจในความสัมพันธ์ แต่บางครั้งไม่อยากขัดใจใคร จึงรับปากง่ายกว่าที่ทำได้จริง", 70],
        persona:"หน้าตาสดใส มีออร่า แต่งตัวมีรสนิยม เป็นที่ดึงดูดสายตา" },
      { em:"⛰️", type:"คนอดทน หนักแน่น ทำงานจริงจัง", color:"ม่วง/ดำ",
        sum:"คุณเป็นคนอดทน มีความรับผิดชอบสูง ทำอะไรต้องทำให้สำเร็จ มักสร้างตัวด้วยตัวเอง แต่เก็บความรู้สึกเก่งจนคนอื่นเข้าถึงยาก",
        mood:["ดูนิ่งภายนอก แต่ภายในคิดมากและเก็บกด ควรหาเวลาผ่อนคลายและพูดความรู้สึกออกมา", 55],
        nature:"ขยัน อดทน รักความสงบ ชอบวางแผนระยะยาว ระวังตัว ไม่ไว้ใจใครง่าย แต่เมื่อไว้ใจแล้วจะเป็นเพื่อนแท้",
        honest:["ซื่อตรง รักษาสัญญา ไม่ชอบเอาเปรียบคนอื่น ความจงรักภักดีสูงมากกับคนที่ไว้ใจ", 90],
        persona:"สุขุม ดูลึกลับเล็กน้อย พูดน้อยแต่จริงจัง ให้ความรู้สึกพึ่งพาได้" }
    ];

    // ราศีสากล: [ชื่อ, สัญลักษณ์, ธาตุ, ลักษณะ, วันเริ่ม(เดือน,วัน)]
    const ZOD = [
      ["มังกร","♑","ดิน","จริงจัง มีวินัย ทะเยอทะยาน",[12,22]],
      ["กุมภ์","♒","ลม","เป็นตัวของตัวเอง รักอิสระ คิดนอกกรอบ",[1,20]],
      ["มีน","♓","น้ำ","อ่อนไหว มีจินตนาการ เห็นอกเห็นใจ",[2,19]],
      ["เมษ","♈","ไฟ","กล้าหาญ กระตือรือร้น ชอบนำ",[3,21]],
      ["พฤษภ","♉","ดิน","มั่นคง อดทน รักความสบาย",[4,20]],
      ["เมถุน","♊","ลม","ช่างพูดคุย อยากรู้อยากเห็น ปรับตัวเก่ง",[5,21]],
      ["กรกฎ","♋","น้ำ","รักครอบครัว อ่อนโยน ปกป้องคนที่รัก",[6,21]],
      ["สิงห์","♌","ไฟ","มั่นใจ ใจกว้าง รักเกียรติ",[7,23]],
      ["กันย์","♍","ดิน","ละเอียด รอบคอบ ชอบความเป็นระเบียบ",[8,23]],
      ["ตุลย์","♎","ลม","รักความสมดุล มีเสน่ห์ ชอบความยุติธรรม",[9,23]],
      ["พิจิก","♏","น้ำ","ลึกซึ้ง มุ่งมั่น หวงแหนคนที่รัก",[10,23]],
      ["ธนู","♐","ไฟ","รักอิสระ มองโลกแง่ดี ชอบผจญภัย",[11,22]]
    ];
    function zodiac(m, d) {
      let z = ZOD[0];
      if (m === 12 && d >= 22) return z;
      for (const s of ZOD.slice(1)) {
        const [sm, sd] = s[4];
        if (m > sm || (m === sm && d >= sd)) z = s;
      }
      return z;
    }
    // นักษัตร: ปี ค.ศ. 4 = ชวด (ใช้ปีปฏิทินเป็นหลัก ไม่คิดวันตรุษจีน)
    const ANIMAL = ["ชวด (หนู)","ฉลู (วัว)","ขาล (เสือ)","เถาะ (กระต่าย)","มะโรง (งูใหญ่)","มะเส็ง (งูเล็ก)","มะเมีย (ม้า)","มะแม (แพะ)","วอก (ลิง)","ระกา (ไก่)","จอ (สุนัข)","กุน (หมู)"];
    const AEMOJI = ["🐭","🐮","🐯","🐰","🐲","🐍","🐴","🐑","🐵","🐔","🐶","🐷"];

    // 12 แบบตามลักษณะนิสัยและพฤติกรรม: [ชื่อ, ลักษณะนิสัย, วิธีรับมือ]

      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</body>
